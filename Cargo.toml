[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
msh-syntax = { path = "crates/msh-syntax" }
msh-runtime = { path = "crates/msh-runtime" }
# Só para `_exit`, que o nix não expõe (usado em exec/sys.rs).
libc = "0.2.191"
nix = { version = "0.32.0", default-features = false }
thiserror = "2.0.21"
# ADR-006: edição de linha e histórico. Sem o histórico em arquivo e sem os
# atalhos customizáveis, que o minishell não usa.
rustyline = { version = "19.0.0", default-features = false }
# dev
insta = "1.49.0"
proptest = "1.12.0"
rexpect = "0.7.1"

[workspace.lints.rust]
# ADR-005: `unsafe` só é liberado em `msh-runtime/src/exec/sys.rs`.
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
panic = "abort"

# Snapshots do insta ficam mais rápidos de comparar com o crate otimizado.
[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3
