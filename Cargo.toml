[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
msh-syntax = { path = "crates/msh-syntax" }
msh-runtime = { path = "crates/msh-runtime" }
msh-files = { path = "crates/msh-files" }
# Só para `_exit`, que o nix não expõe (usado em exec/sys.rs).
libc = "0.2.191"
nix = { version = "0.32.0", default-features = false }
thiserror = "2.0.21"
# ADR-006: edição de linha e histórico. Sem o histórico em arquivo e sem os
# atalhos customizáveis, que o minishell não usa.
rustyline = { version = "19.0.0", default-features = false }
# Fase 2 (ADR-011). As features fixam a versão mínima das bibliotecas do
# sistema: o Debian 13 tem GTK 4.18, libadwaita 1.7 e VTE 0.80; pedimos
# menos (4.12, 1.5 e 0.76) para compilar também no Ubuntu 24.04.
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_5"] }
vte = { package = "vte4", version = "0.10.0", features = ["v0_76"] }
# dev
insta = "1.49.0"
proptest = "1.12.0"
rexpect = "0.7.1"

[workspace.lints.rust]
# ADR-005: `unsafe` só é liberado em `msh-runtime/src/exec/sys.rs`.
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
panic = "abort"

# Snapshots do insta ficam mais rápidos de comparar com o crate otimizado.
[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3
